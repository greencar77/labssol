tasks.register('hello') {
    println 'hic'
    doLast {
        println 'Hello World'
    }
    println 'hic2'
    doLast {
        println 'Hello World2'
    }
    doFirst {
        println 'first'
    }
}

tasks.register('bye') {
    dependsOn hello
    doLast {
        println 'bye World'
    }
}
